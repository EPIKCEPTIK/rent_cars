
services:
  db:
    image: postgres:15
    container_name: car_rental_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: car_rental_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rent_cars-backend:
    build: .
    container_name: rent_cars-backend
    depends_on:
      db:
        condition: service_healthy

    environment:
    # MUST match the database service name above

      - DB_HOST=db
    ports:
     - "8080:8080"



volumes:
  postgres_data: